{% load tailwind_field %}
<div id="div_{{ field.auto_id }}" class="{% if field_class %}{{ field_class }}{% else %}mb-3{% endif %}">
  <label for="{{ field.id_for_label }}" class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
    {% tailwind_field field %}
    <span>{{ field.label|safe }}{% if field.field.required %}<span class="asteriskField">*</span>{% endif %}</span>
  </label>
  {% include 'tailwind/layout/help_text_and_errors.html' %}
</div>
